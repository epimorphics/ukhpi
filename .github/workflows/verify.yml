name: 'Verify Code'

permissions:
  contents: read
  packages: read

on:
  workflow_call: {}

jobs:
  lint-js:
    name: ESLint (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node Environment
        uses: ./.github/actions/setup-node

      - name: Run ESLint
        run: yarn lint

  lint-ruby:
    name: RuboCop (Ruby)
    env:
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: "x-access-token:${{ secrets.GITHUB_TOKEN }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Ruby Environment
        uses: ./.github/actions/setup-ruby
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run RuboCop
        run: bundle exec rubocop --parallel

  test-ruby:
    name: Rails Test Suite
    env:
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: "x-access-token:${{ secrets.GITHUB_TOKEN }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Ruby Environment
        uses: ./.github/actions/setup-ruby
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # public/vite* is gitignored, so the manifest has to be built here. Any
      # test that renders the application layout calls vite_asset_path, which
      # raises without it. Vite Ruby's autoBuild can't cover for this, as that
      # shells out to a build that needs the Node toolchain installed below.
      - name: Setup Node Environment
        uses: ./.github/actions/setup-node

      - name: Build Vite assets for test
        run: bin/vite build --mode=test

      - name: Run Rails tests
        run: bin/rails test
